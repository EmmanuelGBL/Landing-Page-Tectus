# Nginx da landing da Tectus. VPS Hostinger, 72.61.48.71.
#
# Servir HTML estático puro, que é o que `output: "export"` do Next gera. Sem
# Node rodando no servidor, sem processo para reiniciar, sem porta interna.
#
# Instalar em /etc/nginx/sites-available/tectussolucoes e criar o link em
# sites-enabled. O certbot acrescenta os blocos 443 sozinho depois.

# ---------------------------------------------------------------------------
# www redireciona para o domínio sem www.
#
# O site se declara como https://tectussolucoes.com.br no canonical, no
# sitemap e no structured data. Se o www servisse o mesmo conteúdo em vez de
# redirecionar, o Google veria dois endereços com a mesma página e escolheria
# sozinho qual indexar, o que joga fora parte do sinal de cada um.
#
# `$scheme` e não `https` fixo de propósito: antes do certificado existir a
# única coisa que responde é HTTP, e forçar https aqui quebraria a validação
# do certbot no nome www. Depois do certbot o esquema já chega como https e o
# redirecionamento aponta para o lugar certo.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name www.tectussolucoes.com.br;

    return 301 $scheme://tectussolucoes.com.br$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name tectussolucoes.com.br;

    # Symlink trocado a cada publicação. Ver deploy/publicar-vps.sh.
    # O código-fonte fica em /var/www/tectus/site e o build sai para
    # /var/www/tectus/releases/<data-hora>, nunca servido direto.
    root /var/www/tectus/current;
    index index.html;

    # Não anunciar a versão do nginx no cabeçalho e na página de erro.
    server_tokens off;

    charset utf-8;

    # -----------------------------------------------------------------------
    # Compressão. O peso da página é quase todo texto, então isso vale mais
    # aqui do que qualquer outro ajuste de performance do servidor.
    # -----------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # -----------------------------------------------------------------------
    # Roteamento do export estático.
    #
    # `$uri.html` é o que faz as rotas de oferta funcionarem quando elas
    # existirem: /automacao serve out/automacao.html sem barra no fim e sem
    # redirecionamento. Sem essa linha, cada rota nova daria 404.
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;

    # -----------------------------------------------------------------------
    # A imagem de Open Graph.
    #
    # O export grava `out/opengraph-image` sem extensão no nome, e servidor
    # estático entrega isso como binário genérico. WhatsApp e LinkedIn
    # descartam o preview quando o tipo não é de imagem. Este bloco é o que
    # antes vivia no netlify.toml. Se um dia o preview de link sumir, é o
    # primeiro lugar para olhar.
    # -----------------------------------------------------------------------
    location = /opengraph-image {
        default_type image/png;
        add_header Cache-Control "public, max-age=86400";
    }

    # -----------------------------------------------------------------------
    # Cache.
    #
    # Tudo em /_next/static/ carrega hash de conteúdo no nome, então o arquivo
    # nunca muda sem mudar de endereço e pode ser guardado para sempre.
    #
    # O HTML é o oposto: precisa revalidar a cada visita, senão a correção de
    # texto que você publicar hoje continua invisível para quem já visitou.
    # É exatamente o cenário desta fase, em que a página vai mudar toda semana.
    # -----------------------------------------------------------------------
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ~* \.(webp|png|jpg|jpeg|svg|ico|woff2)$ {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location = / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # robots.txt e sitemap.xml mudam junto com o conteúdo e são lidos por
    # robô, que não deve pegar versão velha.
    location = /robots.txt {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # -----------------------------------------------------------------------
    # Cabeçalhos de segurança.
    #
    # Sem Content-Security-Policy aqui de propósito: a página carrega o GTM,
    # que injeta script de terceiro em tempo de execução, e uma CSP escrita no
    # escuro quebraria a medição em silêncio. Ela entra depois, quando estiver
    # fechado o que o container carrega de fato.
    # -----------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Arquivo oculto que porventura escape para o diretório publicado.
    location ~ /\. {
        deny all;
    }
}
